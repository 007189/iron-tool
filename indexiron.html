<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同盟精铁查询工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:hsl(210 20% 97%);
  --card:hsl(0 0% 100%);
  --fg:hsl(215 28% 17%);
  --muted:hsl(215 14% 45%);
  --border:hsl(214 15% 88%);
  --primary:hsl(198 85% 42%);
  --primary-fg:#fff;
  --accent:hsl(210 25% 94%);
  --accent-fg:hsl(215 28% 17%);
  --success:#059669;
  --destructive:#ef4444;
  --warning:#f59e0b;
  --radius:8px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5;min-height:100vh;
}
.container{max-width:720px;margin:0 auto;padding:20px 14px;}
@media(min-width:768px){.container{padding:28px 20px;}}

/* Header */
.header{display:flex;align-items:start;justify-content:space-between;margin-bottom:14px;}
.header h1{font-size:18px;font-weight:600;}
.header p{font-size:11px;color:var(--muted);margin-top:2px;}
.header-right{text-align:right;font-size:11px;color:var(--muted);line-height:1.4;}
.header-right .count{font-weight:500;color:var(--fg);}

/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:10px;overflow:hidden;}
.card-body{padding:12px 14px;}

/* Live query */
.live-query{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.live-left{display:flex;align-items:center;gap:10px;min-width:0;}
.live-left .icon{color:var(--muted);flex-shrink:0;}
.live-label{font-size:11px;color:var(--muted);}
.live-time{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;}
.live-time .sec{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px;}
.live-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.base-day{display:flex;align-items:center;gap:5px;}
.base-day label{font-size:11px;color:var(--muted);white-space:nowrap;}
.base-day select{height:26px;padding:0 6px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--fg);width:52px;}

/* Switch */
.switch-wrap{display:flex;align-items:center;gap:6px;}
.switch-wrap span{font-size:11px;color:var(--muted);}
.switch{position:relative;width:34px;height:18px;background:var(--border);border-radius:999px;cursor:pointer;transition:background .15s;}
.switch.on{background:var(--primary);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .15s;}
.switch.on::after{transform:translateX(16px);}

.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn:hover{background:var(--accent);}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);}
.btn.primary:hover{opacity:.9;}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);}
.btn.ghost:hover{background:var(--accent);color:var(--fg);}
.btn.danger{color:var(--destructive);}
.btn.danger:hover{background:#fef2f2;}
.btn-sm{padding:3px 7px;font-size:10px;}
.btn-icon{width:26px;height:26px;padding:0;justify-content:center;}

/* Time selector */
.time-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.time-group{display:flex;align-items:center;gap:4px;}
.time-group label{font-size:11px;color:var(--muted);}
.time-group select,.time-group input{height:30px;padding:0 7px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--card);color:var(--fg);text-align:center;}
.time-group select{width:72px;}
.time-group input[type=number]{width:56px;}

.quick-btns{display:flex;gap:5px;flex-wrap:wrap;}
.btn-quick{padding:4px 9px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s;}
.btn-quick:hover{background:var(--accent);color:var(--fg);}
.btn-quick.active{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);}

/* Section title */
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;}
.section-title h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px;}
.section-title h2 .hint{font-size:10px;font-weight:400;color:var(--muted);}
.section-actions{display:flex;gap:5px;}

/* Alliance cards */
.alliance-list{display:flex;flex-direction:column;gap:6px;}
.alliance-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;transition:box-shadow .15s;}
.alliance-card:hover{box-shadow:var(--shadow-md);}

.ac-header{width:100%;padding:10px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:none;text-align:left;}
.ac-rank{width:22px;height:22px;flex-shrink:0;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:11px;}
.ac-name{flex:1;min-width:0;display:flex;align-items:center;gap:5px;}
.ac-name .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ac-name .name{font-size:13px;font-weight:500;truncate:none;}

.ac-level{display:none;}
@media(min-width:480px){
  .ac-level{display:block;width:80px;text-align:center;flex-shrink:0;}
}
.ac-level-badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:500;line-height:1.4;}
.ac-next{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ac-next .jump{color:var(--primary);cursor:pointer;text-decoration:none;}
.ac-next .jump:hover{text-decoration:underline;}

.ac-iron{flex-shrink:0;width:72px;text-align:right;}
@media(min-width:640px){.ac-iron{width:90px;}}
.ac-iron .num{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;}
.ac-iron .label{font-size:10px;color:var(--muted);margin-top:1px;}

.ac-total,.ac-consume,.ac-extra{display:none;}
@media(min-width:640px){
  .ac-total{display:block;width:64px;text-align:right;flex-shrink:0;}
  .ac-consume{display:block;width:64px;text-align:right;flex-shrink:0;}
  .ac-extra{display:block;width:56px;text-align:center;flex-shrink:0;}
}
.ac-total .v,.ac-consume .v,.ac-extra .v{font-size:12px;font-weight:500;font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.ac-total .l,.ac-consume .l,.ac-extra .l{font-size:10px;color:var(--muted);}

.ac-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.ac-action-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--muted);cursor:pointer;border:none;background:transparent;transition:all .15s;}
.ac-action-btn:hover{background:var(--accent);color:var(--fg);}
.ac-chevron{color:var(--muted);transition:transform .2s;}
.alliance-card.expanded .ac-chevron{transform:rotate(180deg);}

/* Detail */
.ac-detail{max-height:0;overflow:hidden;transition:max-height .25s ease;border-top:0 solid var(--border);}
.alliance-card.expanded .ac-detail{max-height:2000px;border-top-width:1px;}
.ac-detail-inner{padding:12px 14px;background:hsl(210 25% 94% / .3);}
.detail-section{margin-bottom:14px;}
.detail-section:last-child{margin-bottom:0;}
.detail-section h4{font-size:12px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:5px;}
.detail-section h4 .sub{margin-left:auto;font-size:11px;font-weight:400;color:var(--muted);}
.detail-table-wrap{overflow-x:auto;border-radius:5px;border:1px solid var(--border);}
.detail-table{width:100%;border-collapse:collapse;font-size:11px;}
.detail-table th,.detail-table td{padding:4px 7px;text-align:left;border-bottom:1px solid var(--accent);white-space:nowrap;}
.detail-table th{font-weight:500;color:var(--muted);background:var(--accent);}
.detail-table td.num,.detail-table th.num{text-align:right;font-variant-numeric:tabular-nums;}
.detail-table tr:last-child td{border-bottom:none;}
.detail-summary-row td{font-weight:600;}
.before-start-tag{display:inline-block;padding:1px 6px;border-radius:4px;background:#fef3c7;color:#92400e;font-size:10px;margin-left:4px;}
.empty-hint{font-size:12px;color:var(--muted);padding:8px 0;text-align:center;}

/* Extra table header color */
.extra-table thead th{background:#d1fae5;color:#065f46;}
.consume-table thead th{background:#fee2e2;color:#991b1b;}

/* Total summary */
.total-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:14px 16px;margin-top:10px;}
.total-row{display:flex;justify-content:space-between;align-items:baseline;}
.total-label{font-size:12px;color:var(--muted);}
.total-num{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;font-size:22px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums;}
.total-sub{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px;}

/* Compare */
.compare-section{margin-top:14px;}
.compare-controls{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;font-size:11px;}
.compare-controls select{height:26px;padding:0 6px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:var(--card);}
.compare-list{display:flex;flex-direction:column;gap:3px;}
.compare-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;font-size:12px;background:var(--accent);}
.compare-row .name{flex:1;min-width:0;display:flex;align-items:center;gap:5px;}
.compare-row .val{font-family:ui-monospace,monospace;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;}
.compare-row .diff{font-family:ui-monospace,monospace;font-weight:600;font-variant-numeric:tabular-nums;font-size:12px;}
.compare-row .diff.plus{color:var(--success);}
.compare-row .diff.minus{color:var(--destructive);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:12px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--card);border-radius:var(--radius);width:100%;max-width:960px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;}
.modal-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-header h3{font-size:15px;font-weight:600;}
.modal-body{overflow-y:auto;padding:12px 14px;flex:1;}
.modal-footer{padding:10px 14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;flex-shrink:0;}
.modal-footer-right{display:flex;gap:6px;}

/* Bulk editor */
.bulk-tabs{display:flex;gap:3px;margin-bottom:10px;border-bottom:1px solid var(--border);}
.bulk-tab{padding:5px 10px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);margin-bottom:-1px;}
.bulk-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500;}
.bulk-scroll{width:100%;overflow-x:auto;margin-bottom:10px;border-radius:5px;border:1px solid var(--border);}
.bulk-table{width:100%;border-collapse:collapse;font-size:10px;min-width:600px;}
.bulk-table th,.bulk-table td{border:1px solid var(--border);padding:3px 4px;text-align:center;white-space:nowrap;}
.bulk-table th{background:var(--accent);font-weight:500;color:var(--muted);position:sticky;top:0;z-index:1;}
.bulk-table th.name-col,.bulk-table td.name-col{position:sticky;left:0;background:var(--card);z-index:2;text-align:left;min-width:90px;}
.bulk-table th.name-col{background:var(--accent);z-index:3;}
.bulk-table td input,.bulk-table td select{width:100%;min-width:38px;border:1px solid transparent;border-radius:3px;padding:2px 3px;font-size:10px;text-align:center;background:transparent;color:var(--fg);font-family:inherit;}
.bulk-table td input:focus,.bulk-table td select:focus{outline:none;border-color:var(--primary);background:#fff;}
.alliance-tag{display:inline-block;width:3px;height:11px;border-radius:2px;margin-right:4px;vertical-align:middle;}
.del-btn{color:var(--destructive);font-size:12px;cursor:pointer;float:right;font-weight:bold;}
.del-btn:hover{opacity:.7;}

.add-row{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.add-row input[type=text]{height:28px;padding:0 7px;border:1px solid var(--border);border-radius:6px;font-size:12px;flex:1;min-width:100px;}
.add-row input[type=color]{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;padding:1px;cursor:pointer;}

/* Consume editor */
.consume-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.consume-item{display:flex;flex-direction:column;gap:2px;}
.consume-item label{font-size:11px;color:var(--muted);}
.consume-item input{height:28px;padding:0 7px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:right;font-variant-numeric:tabular-nums;}
.consume-total{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;}
.consume-total .label{font-size:12px;color:var(--muted);}
.consume-total .val{font-family:ui-monospace,monospace;font-size:18px;font-weight:700;color:var(--destructive);font-variant-numeric:tabular-nums;}

/* Toast */
.toast-container{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:5px;}
.toast{padding:7px 12px;background:var(--fg);color:var(--card);border-radius:6px;font-size:12px;box-shadow:var(--shadow-md);animation:toastIn .2s ease;}
.toast.success{background:#059669;color:#fff;}
.toast.error{background:#dc2626;color:#fff;}
.toast.info{background:var(--fg);}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

.mono{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums;}
.text-right{text-align:right;}
.muted{color:var(--muted);}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div>
      <h1>同盟精铁查询</h1>
      <p>选择时间节点，查看各同盟精铁数量及计算明细</p>
    </div>
    <div class="header-right">
      <div id="headerDayTime">第 4 天 --:--</div>
      <div><span class="count" id="headerCount">6</span> 个同盟</div>
    </div>
  </div>

  <!-- Live query card -->
  <div class="card">
    <div class="card-body">
      <div class="live-query">
        <div class="live-left">
          <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <div>
            <div class="live-label" id="liveLabel">实时跟随 · 第 4 天</div>
            <div class="live-time">
              <span id="liveHH">00</span>:<span id="liveMM">00</span>
              <span class="sec" id="liveSS">:00</span>
            </div>
          </div>
        </div>
        <div class="live-right">
          <div class="base-day">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
            <label for="baseDaySel">今天第</label>
            <select id="baseDaySel"></select>
            <label>天</label>
          </div>
          <button class="btn ghost btn-sm" id="restoreRealtimeBtn" style="display:none">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:3px"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            恢复实时
          </button>
          <div class="switch-wrap">
            <span>实时模式</span>
            <div class="switch on" id="realtimeSwitch"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Time selector -->
  <div class="card">
    <div class="card-body">
      <div class="time-row">
        <div class="time-group">
          <label>天数</label>
          <select id="daySel"></select>
        </div>
        <div class="time-group">
          <label>时</label>
          <input type="number" id="hourInput" min="0" max="23" value="10">
        </div>
        <div class="time-group">
          <label>分</label>
          <input type="number" id="minInput" min="0" max="59" value="0">
        </div>
      </div>
      <div class="quick-btns" id="quickBtns">
        <button class="btn-quick" data-d="4" data-h="8" data-m="0">今早08:00</button>
        <button class="btn-quick" data-d="4" data-h="10" data-m="0">今早10:00</button>
        <button class="btn-quick" data-d="4" data-h="22" data-m="0">今晚22:00</button>
        <button class="btn-quick" data-d="5" data-h="7" data-m="0">明早07:00</button>
      </div>
    </div>
  </div>

  <!-- Alliance list -->
  <div class="section-title">
    <h2>同盟精铁 <span class="hint">按目前精铁降序</span></h2>
    <div class="section-actions">
      <button class="btn btn-sm danger" id="resetBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:3px"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        恢复默认
      </button>
      <button class="btn btn-sm primary" id="bulkBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:3px"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 3v18"/></svg>
        批量编辑
      </button>
    </div>
  </div>

  <div class="alliance-list" id="allianceList"></div>

  <!-- Total -->
  <div class="total-card">
    <div class="total-row">
      <span class="total-label">合计目前精铁</span>
      <span class="total-num" id="totalCurrent">0</span>
    </div>
    <div class="total-sub">
      <span>精铁总数: <span class="mono" id="totalGross">0</span></span>
      <span>消耗: <span class="mono" id="totalConsume">0</span></span>
    </div>
  </div>

  <!-- Compare -->
  <div class="compare-section">
    <div class="section-title" style="margin-top:14px">
      <h2>同盟对比</h2>
    </div>
    <div class="compare-controls">
      <span class="muted">基准同盟:</span>
      <select id="compareBaseSel"></select>
    </div>
    <div class="compare-list" id="compareList"></div>
  </div>
</div>

<!-- Bulk Editor Modal -->
<div class="modal-overlay" id="bulkModal">
  <div class="modal">
    <div class="modal-header">
      <h3>批量编辑</h3>
      <button class="btn btn-icon ghost" id="bulkCloseBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="bulk-tabs">
        <div class="bulk-tab active" data-tab="upgrade">等级升级</div>
        <div class="bulk-tab" data-tab="extra">额外产出</div>
      </div>
      <div id="tab-upgrade">
        <p style="font-size:11px;color:var(--muted);margin-bottom:8px">
          填写每个等级的升级完成时间（天 + 时:分）。等级 2~20，空着表示尚未升级。支持 HH:MM / HH.MM / HMMM 格式。
        </p>
        <div class="bulk-scroll">
          <table class="bulk-table" id="bulkTable"></table>
        </div>
        <div class="add-row">
          <input type="text" id="newName" placeholder="新同盟名称">
          <input type="color" id="newColor" value="#64748b" title="选择颜色">
          <button class="btn btn-sm" id="addAllianceBtn">

// ================ 工具函数 ================
function toMin(d,h,m){ return (d-1)*1440 + h*60 + m; }
function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function fmtTime(t){
  var dof = Math.floor(t/1440);
  var h = Math.floor((t%1440)/60), m = t%60;
  var hh = String(h).padStart(2,'0'), mm = String(m).padStart(2,'0');
  if(dof===0) return '当天 '+hh+':'+mm;
  return '第'+(dof+1)+'天 '+hh+':'+mm;
}
function fmtTimeShort(t){
  var dof = Math.floor(t/1440);
  var h = Math.floor((t%1440)/60), m = t%60;
  return 'D'+(dof+1)+' '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function parseHM(raw){
  var t = (raw||'').trim();
  if(!t) return null;
  var m = t.match(/^(\d{1,2})[:.\-：](\d{1,2})$/);
  if(m){
    var h=parseInt(m[1],10), mi=parseInt(m[2],10);
    if(h>=0&&h<=23&&mi>=0&&mi<=59) return {hour:h,minute:mi};
    return null;
  }
  m = t.match(/^(\d{2})(\d{2})$/);
  if(m){
    h=parseInt(m[1],10); mi=parseInt(m[2],10);
    if(h>=0&&h<=23&&mi>=0&&mi<=59) return {hour:h,minute:mi};
  }
  return null;
}
function toast(msg,type){
  type = type||'info';
  var c=document.getElementById('toastContainer');
  var el=document.createElement('div');
  el.className='toast '+type; el.textContent=msg;
  c.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2200);
}

// ================ 存储 ================

  query:'alliance_iron_last_query',

  consumes:'alliance_iron_consumes',

};

function defaultConsume(){
  var c={}; CITY_LEVELS.forEach(function(l){c[l]=0;});
  return {baseCamps:0,cities:c};
}

function normalizeAlliances(arr){
  return arr.map(function(a){
    var eps = (a.extraProductions && a.extraProductions.length>0)
      ? a.extraProductions
      : Array.from({length:EXTRA_PRODUCTION_COUNT},function(_,i){return{index:i+1};});
    return Object.assign({},a,{extraProductions:eps});
  });
}

function loadAlliances(){
  try{
    var ver = localStorage.getItem(SK.version);
    if(ver && String(ver)===String(DATA_VERSION)){
      var raw = localStorage.getItem(SK.alliances);
      if(raw){
        var p = JSON.parse(raw);
        if(Array.isArray(p) && p.length>0) return normalizeAlliances(p);
      }
    }
  }catch(e){}
  var d = JSON.parse(JSON.stringify(DEFAULT_ALLIANCES));
  var n = normalizeAlliances(d);
  saveAlliances(n);
  return n;
}
function saveAlliances(a){
  try{ localStorage.setItem(SK.alliances, JSON.stringify(a)); localStorage.setItem(SK.version, String(DATA_VERSION)); }catch(e){}
}
function loadConsumes(){
  try{ var raw = localStorage.getItem(SK.consumes); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveConsumes(d){ try{ localStorage.setItem(SK.consumes, JSON.stringify(d)); }catch(e){} }
function loadQuery(){
  try{
    var raw = localStorage.getItem(SK.query);
    if(raw){ var p=JSON.parse(raw); if(typeof p.day==='number'&&typeof p.hour==='number'&&typeof p.minute==='number') return p; }
  }catch(e){}
  return {day:4,hour:10,minute:0};
}
function saveQuery(d,h,m){ try{ localStorage.setItem(SK.query, JSON.stringify({day:d,hour:h,minute:m})); }catch(e){} }
function loadBaseDay(){
  try{ var raw=localStorage.getItem(SK.baseDay); if(raw){ var n=parseInt(raw,10); if(!isNaN(n)&&n>=1&&n<=30) return n; } }catch(e){}
  return 4;
}
function saveBaseDay(n){ try{ localStorage.setItem(SK.baseDay, String(n)); }catch(e){} }

// ================ 计算 ================
function calcIron(a, qd, qh, qm){
  var qm2 = toMin(qd,qh,qm);
  if(qm2 < START_MINUTES){
    var nu = null;
    for(var i=0;i<a.upgrades.length;i++){
      var u=a.upgrades[i], um=toMin(u.day,u.hour,u.minute);
      if(um>qm2){ if(!nu || um<toMin(nu.day,nu.hour,nu.minute)) nu={level:u.level,day:u.day,hour:u.hour,minute:u.minute}; }
    }
    return {total:INITIAL_IRON,level:INITIAL_LEVEL,segments:[],extraSegments:[],beforeStart:true,initialIron:INITIAL_IRON,levelProduction:0,extraProductionTotal:0,nextUpgrade:nu};
  }

  var sorted = a.upgrades.slice().sort(function(x,y){ return toMin(x.day,x.hour,x.minute)-toMin(y.day,y.hour,y.minute); });
  var total = INITIAL_IRON, lvl = INITIAL_LEVEL, cur = START_MINUTES, segs=[];

  for(var j=0;j<sorted.length;j++){
    var up=sorted[j], um=toMin(up.day,up.hour,up.minute);
    if(up.level<=lvl) continue;
    if(um<=cur){ lvl=up.level; continue; }
    if(um<=qm2){
      var dur=(um-cur)/60, prod=dur*PRODUCTION_PER_LEVEL_PER_HOUR*lvl;
      total+=prod; segs.push({fromMinutes:cur,toMinutes:um,level:lvl,durationHours:dur,production:prod});
      lvl=up.level; cur=um;
    }else{
      dur=(qm2-cur)/60; prod=dur*PRODUCTION_PER_LEVEL_PER_HOUR*lvl;
      total+=prod; segs.push({fromMinutes:cur,toMinutes:qm2,level:lvl,durationHours:dur,production:prod});
      cur=qm2; break;
    }
  }
  if(cur<qm2){
    dur=(qm2-cur)/60; prod=dur*PRODUCTION_PER_LEVEL_PER_HOUR*lvl;
    total+=prod; segs.push({fromMinutes:cur,toMinutes:qm2,level:lvl,durationHours:dur,production:prod});
  }

  var levelProd = total - INITIAL_IRON;

  // extra
  var extraSegs=[], extraTotal=0;
  if(a.extraProductions && a.extraProductions.length>0){
    var es = a.extraProductions.slice()
      .filter(function(e){ return typeof e.day==='number'&&typeof e.hour==='number'&&typeof e.minute==='number'; })
      .sort(function(x,y){ return toMin(x.day,x.hour,x.minute)-toMin(y.day,y.hour,y.minute); });
    for(var k=0;k<es.length;k++){
      var ex=es[k], em=toMin(ex.day,ex.hour,ex.minute);
      if(em>=qm2) continue;
      var eff = Math.max(em, START_MINUTES);
      if(eff>=qm2) continue;
      dur=(qm2-eff)/60; prod=dur*EXTRA_PRODUCTION_IRON;
      total+=prod; extraTotal+=prod;
      extraSegs.push({index:ex.index,startMinutes:em,endMinutes:qm2,durationHours:dur,production:prod});
    }
  }

  // next
  var nextUp=null;
  for(var l=0;l<sorted.length;l++){
    um=toMin(sorted[l].day,sorted[l].hour,sorted[l].minute);
    if(um>qm2){ nextUp={level:sorted[l].level,day:sorted[l].day,hour:sorted[l].hour,minute:sorted[l].minute}; break; }
  }

  return {total:total,level:lvl,segments:segs,extraSegments:extraSegs,beforeStart:false,initialIron:INITIAL_IRON,levelProduction:levelProd,extraProductionTotal:extraTotal,nextUpgrade:nextUp};
}

function calcConsume(c){
  var t=0;
  t += (c.baseCamps||0) * BASE_CAMP_COST;
  var cities = c.cities||{};
  for(var k in cities){ if(Object.prototype.hasOwnProperty.call(cities,k)){
    var cost = CITY_BUILD_COST[Number(k)]||0;
    t += (cities[k]||0) * cost;
  }}
  return t;
}

// ================ 状态 ================
var state = {
  day:4, hour:10, minute:0,
  realtime:true,
  baseDay:4,
  alliances:[],
  consumes:{},
  expanded:{},
  compareBaseId:null
};
var timer = null;

// ================ 渲染 ================
function getResults(){
  return state.alliances.map(function(a){
    var r = calcIron(a, state.day, state.hour, state.minute);
    var cd = state.consumes[a.id] || defaultConsume();
    var consumed = calcConsume(cd);
    var cur = r.total - consumed;
    return {alliance:a, result:r, consumed:consumed, current:cur, consumeData:cd};
  }).sort(function(x,y){ return y.current - x.current; });
}

function renderAll(){
  renderHeader();
  renderCards();
  renderTotal();
  renderCompare();
  saveQuery(state.day, state.hour, state.minute);
}

function renderHeader(){

}

function renderCards(){

      : '已达最高等级';

    var card = document.createElement('div');
    card.className = 'alliance-card' + (exp?' expanded':'');
    card.innerHTML = `
      <button type="button" class="ac-header" data-id="${a.id}">
        <div class="ac-rank" style="background:${a.color}">${idx+1}</div>
        <div class="ac-name">

          <span class="name">${esc(a.name)}</span>
        </div>
        <div class="ac-level">
          <span class="ac-level-badge" style="background:${a.color}15;color:${a.color}">
            Lv.${r.level}<span style="opacity:.7;font-weight:400"> / ${maxLevel}</span>
          </span>
          <div class="ac-next" title="${esc(nextText)}">
            ${esc(nextText)}
            ${r.nextUpgrade ? ' · <a class="jump" data-jump="'+a.id+'">跳转</a>' : ''}
          </div>
        </div>
        <div class="ac-total"><div class="v">${r.total.toFixed(1)}</div><div class="l">总数</div></div>
        <div class="ac-consume"><div class="v">${item.consumed.toFixed(0)}</div><div class="l">消耗</div></div>
        <div class="ac-extra"><div class="v"><span style="color:var(--fg);font-weight:500">${extraDone}</span>/${extraTotal}</div><div class="l">额外</div></div>
        <div class="ac-iron">
          <div class="num" style="color:${a.color}">${item.current.toFixed(1)}</div>
          <div class="label">目前精铁</div>
        </div>
        <div class="ac-actions">
          <button class="ac-action-btn" data-edit="${a.id}" title="编辑升级时间">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"/><path d="M3 9h18"/><path d="M9 3v18"/></svg>
          </button>
          <button class="ac-action-btn" data-consume="${a.id}" title="编辑消耗精铁">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          </button>
          <svg class="ac-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </button>
      <div class="ac-detail">
        <div class="ac-detail-inner">
          ${renderDetail(a, r, item)}
        </div>
      </div>
    `;

    // 展开/收起
    card.querySelector('.ac-header').addEventListener('click', function(e){
      if(e.target.closest('[data-edit]') || e.target.closest('[data-consume]') || e.target.closest('.jump')) return;
      state.expanded[a.id] = !state.expanded[a.id];
      renderCards();
    });
    // 编辑
    card.querySelector('[data-edit]').addEventListener('click', function(e){
      e.stopPropagation();
      openBulkModal(a.id);
    });
    // 消耗
    card.querySelector('[data-consume]').addEventListener('click', function(e){
      e.stopPropagation();
      openConsumeModal(a.id);
    });
    // 跳转
    var jb = card.querySelector('.jump');
    if(jb){
      jb.addEventListener('click', function(e){
        e.stopPropagation();
        if(r.nextUpgrade){
          setRealtime(false);
          state.day = r.nextUpgrade.day;
          state.hour = r.nextUpgrade.hour;
          state.minute = r.nextUpgrade.minute;
          syncInputs();
          renderAll();
          toast('已跳转到 '+a.name+' 升级到 Lv.'+r.nextUpgrade.level+' 的时间点', 'success');
        }
      });
    }

    list.appendChild(card);
  });
}

function renderDetail(a, r, item){
  var html = '';
  if(r.beforeStart){
    html += '<div class="empty-hint">查询时间早于 12:13，尚未开始计时。初始精铁 '+r.initialIron+'。</div>';
  } else {
    // 等级产出
    html += '<div class="detail-section">';
    html += '<h4><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg> 等级产出明细<span class="sub">小计 '+r.levelProduction.toFixed(1)+'</span></h4>';
    html += '<div class="detail-table-wrap"><table class="detail-table"><thead><tr>';
    html += '<th>时间段</th><th style="text-align:center">等级</th><th class="num">时长(h)</th><th class="num">产出精铁</th>';
    html += '</tr></thead><tbody>';
    r.segments.forEach(function(seg){

  if(parts.length===0) parts.push('无消耗');

  html += '</tbody></table></div></div>';

  return html;

function renderTotal(){
  var r = getResults();
  var cur = r.reduce(function(s,x){return s+x.current;},0);
  var gross = r.reduce(function(s,x){return s+x.result.total;},0);
  var cons = r.reduce(function(s,x){return s+x.consumed;},0);
  document.getElementById('totalCurrent').textContent = cur.toFixed(1);
  document.getElementById('totalGross').textContent = gross.toFixed(1);
  document.getElementById('totalConsume').textContent = cons.toFixed(0);
}

function renderCompare(){
  var results = getResults();
  var baseSel = document.getElementById('compareBaseSel');
  var baseId = state.compareBaseId || (results[0] && results[0].alliance.id);
  state.compareBaseId = baseId;

  baseSel.innerHTML = '';
  results.forEach(function(r){
    var o = document.createElement('option');
    o.value = r.alliance.id;
    o.textContent = r.alliance.name;
    if(r.alliance.id===baseId) o.selected=true;
    baseSel.appendChild(o);
  });

  var base = results.find(function(r){return r.alliance.id===baseId;});
  var list = document.getElementById('compareList');
  list.innerHTML = '';
  if(!base) return;

  results.forEach(function(r){
    if(r.alliance.id===baseId) return;
    var diff = r.current - base.current;
    var row = document.createElement('div');
    row.className = 'compare-row';
    row.innerHTML =
      '<span class="name"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+r.alliance.color+';margin-right:4px;vertical-align:middle"></span>'+esc(r.alliance.name)+' <span class="muted" style="font-size:10px">Lv.'+r.result.level+'</span></span>'+
      '<span class="val">'+r.current.toFixed(1)+'</span>'+
      '<span class="diff '+(diff>=0?'plus':'minus')+'">'+(diff>=0?'+':'')+diff.toFixed(1)+'</span>';
    list.appendChild(row);
  });
}

// ================ 实时模式 ================
function setRealtime(on){
  state.realtime = on;
  var sw = document.getElementById('realtimeSwitch');
  var rr = document.getElementById('restoreRealtimeBtn');
  if(on){
    sw.classList.add('on');
    rr.style.display = 'none';
    startRealtime();
  } else {
    sw.classList.remove('on');
    rr.style.display = '';
    stopRealtime();
  }
  updateLiveDisplay();
}

function startRealtime(){
  stopRealtime();
  updateRealtime();
  timer = setInterval(updateRealtime, 1000);
}
function stopRealtime(){ if(timer){ clearInterval(timer); timer=null; } }

function updateRealtime(){
  var now = new Date();
  state.day = state.baseDay;
  state.hour = now.getHours();
  state.minute = now.getMinutes();
  syncInputs();
  renderAll();
  updateLiveDisplay();
}

function updateLiveDisplay(){
  var now = new Date();
  var hh, mm, ss;
  if(state.realtime){
    hh = String(now.getHours()).padStart(2,'0');
    mm = String(now.getMinutes()).padStart(2,'0');
    ss = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('liveLabel').textContent = '实时跟随 · 第 '+state.baseDay+' 天';
  } else {
    hh = String(state.hour).padStart(2,'0');
    mm = String(state.minute).padStart(2,'0');
    ss = '00';
    document.getElementById('liveLabel').textContent = '查询时间 · 第 '+state.day+' 天';
  }
  document.getElementById('liveHH').textContent = hh;
  document.getElementById('liveMM').textContent = mm;
  document.getElementById('liveSS').textContent = ':'+ss;
}

function syncInputs(){
  document.getElementById('daySel').value = String(state.day);
  document.getElementById('hourInput').value = state.hour;
  document.getElementById('minInput').value = state.minute;
}

var bulkState = { cellMap:{}, extraMap:{}, activeTab:'upgrade', scrollToId:null };

function openBulkModal(scrollToId){
  bulkState.cellMap = {};
  bulkState.extraMap = {};
  bulkState.scrollToId = scrollToId || null;
  state.alliances.forEach(function(a){
    bulkState.cellMap[a.id] = {};
    a.upgrades.forEach(function(u){
      bulkState.cellMap[a.id][u.level] = {
        day: u.day,
        time: String(u.hour).padStart(2,'0')+':'+String(u.minute).padStart(2,'0')
      };
    });
    bulkState.extraMap[a.id] = {};
    if(a.extraProductions){
      a.extraProductions.forEach(function(ep){
        if(typeof ep.day==='number'&&typeof ep.hour==='number'&&typeof ep.minute==='number'){
          bulkState.extraMap[a.id][ep.index] = {
            day: ep.day,
            time: String(ep.hour).padStart(2,'0')+':'+String(ep.minute).padStart(2,'0')
          };
        }
      });
    }
  });
  renderBulkTable();
  renderExtraTable();
  switchTab('upgrade');
  document.getElementById('bulkModal').classList.add('show');
}
function closeBulkModal(){ document.getElementById('bulkModal').classList.remove('show'); }

function switchTab(tab){
  bulkState.activeTab = tab;
  document.querySelectorAll('.bulk-tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.tab===tab);
  });
  document.getElementById('tab-upgrade').style.display = tab==='upgrade'?'':'none';

function saveBulk(){
  var updated = [];
  var changed = 0;

  state.alliances.forEach(function(a, idx){
    var ups = [];
    var row = bulkState.cellMap[a.id] || {};
    LEVELS.forEach(function(lv){
      var c = row[lv];
      if(!c) return;
      var t = (c.time||'').trim();
      if(!t) return;
      var hm = parseHM(t);
      if(!hm) return;
      var d = c.day && c.day>=1 && c.day<=30 ? c.day : 1;
      ups.push({level:lv, day:d, hour:hm.hour, minute:hm.minute});
    });
    ups.sort(function(x,y){ return toMin(x.day,x.hour,x.minute)-toMin(y.day,y.hour,y.minute); });

    // extra
    var erow = bulkState.extraMap[a.id] || {};
    var eps = [];
    for(var i=1;i<=EXTRA_PRODUCTION_COUNT;i++){
      var ec = erow[i];
      if(ec && ec.day && ec.time && ec.time.trim()){
        var ehm = parseHM(ec.time.trim());
        if(ehm){ eps.push({index:i, day:ec.day, hour:ehm.hour, minute:ehm.minute}); continue; }
      }
      eps.push({index:i});
    }

    // diff
    var old = a.upgrades;
    var has = false;
    if(ups.length !== old.length) has = true;
    else{
      for(var j=0;j<ups.length;j++){
        if(ups[j].level!==old[j].level||ups[j].day!==old[j].day||ups[j].hour!==old[j].hour||ups[j].minute!==old[j].minute){
          has=true; break;
        }
      }
    }
    if(has) changed++;

    updated.push({id:a.id, name:a.name, color:a.color, upgrades:ups, extraProductions:eps});
  });

  state.alliances = updated;
  saveAlliances(state.alliances);
  closeBulkModal();
  renderAll();
  if(changed>0) toast('已保存 '+changed+' 个同盟的升级数据', 'success');
  else toast('数据未发生变化', 'info');
}

function addAlliance(){
  var nameInput = document.getElementById('newName');

  var name = nameInput.value.trim();
  if(!name){ toast('请输入同盟名称', 'error'); return; }
  var id = 'new_' + Date.now();
  var na = {
    id:id, name:name, color:colorInput.value, upgrades:[],
    extraProductions: Array.from({length:EXTRA_PRODUCTION_COUNT},function(_,i){return{index:i+1};})
  };
  state.alliances.push(na);
  bulkState.cellMap[id] = {};
  bulkState.extraMap[id] = {};
  nameInput.value = '';
  renderBulkTable();
  renderExtraTable();
  toast('已添加同盟 '+name, 'success');
}

// ================ 初始化 ================
function init(){
  // 填充选择器
  var ds = document.getElementById('daySel');
  for(var d=1; d<=30; d++){
    var o=document.createElement('option');
    o.value = String(d);
    o.textContent = '第 '+d+' 天';
    ds.appendChild(o);
  }
  var bs = document.getElementById('baseDaySel');
  for(var d=1; d<=30; d++){
    var o2=document.createElement('option');
    o2.value = String(d);
    o2.textContent = String(d);
    bs.appendChild(o2);
  }

  // 加载数据
  state.alliances = loadAlliances();
  state.consumes = loadConsumes();
  state.baseDay = loadBaseDay();
  var q = loadQuery();
  state.day = q.day; state.hour = q.hour; state.minute = q.minute;

  document.getElementById('baseDaySel').value = String(state.baseDay);
  syncInputs();

  // 对比基准
  try{
    var cb = localStorage.getItem(SK.compareBase);
    if(cb) state.compareBaseId = cb;
  }catch(e){}

  // 实时开关
  document.getElementById('realtimeSwitch').addEventListener('click', function(){
    setRealtime(!state.realtime);
  });
  document.getElementById('restoreRealtimeBtn').addEventListener('click', function(){
    setRealtime(true);
  });

  // 基准日
  document.getElementById('baseDaySel').addEventListener('change', function(){
    var n = parseInt(this.value,10);
    if(isNaN(n)||n<1||n>30) return;
    state.baseDay = n;
    saveBaseDay(n);
    if(state.realtime){
      state.day = n;
      syncInputs();
      renderAll();
    }
    updateLiveDisplay();
  });

  // 时间选择
  document.getElementById('daySel').addEventListener('change', function(){
    setRealtime(false);
    state.day = Number(this.value);
    renderAll();
    updateLiveDisplay();
  });
  document.getElementById('hourInput').addEventListener('input', function(){
    setRealtime(false);
    var v = parseInt(this.value||'0',10);
    if(isNaN(v)||v<0) v=0; if(v>23) v=23;
    state.hour = v;
    renderAll();
    updateLiveDisplay();
  });
  document.getElementById('minInput').addEventListener('input', function(){
    setRealtime(false);
    var v = parseInt(this.value||'0',10);
    if(isNaN(v)||v<0) v=0; if(v>59) v=59;
    state.minute = v;
    renderAll();
    updateLiveDisplay();
  });

  // 快捷按钮
  document.querySelectorAll('.btn-quick').forEach(function(btn){
    btn.addEventListener('click', function(){
      var d=Number(this.dataset.d), h=Number(this.dataset.h), m=Number(this.dataset.m);
      setRealtime(false);
      state.day=d; state.hour=h; state.minute=m;
      syncInputs();
      renderAll();
      updateLiveDisplay();
      document.querySelectorAll('.btn-quick').forEach(function(b){b.classList.remove('active');});
      this.classList.add('active');
    });
  });

  // 批量编辑
  document.getElementById('bulkBtn').addEventListener('click', function(){ openBulkModal(); });
  document.getElementById('bulkCloseBtn').addEventListener('click', closeBulkModal);
  document.getElementById('bulkCancelBtn').addEventListener('click', closeBulkModal);
  document.getElementById('bulkSaveBtn').addEventListener('click', saveBulk);
  document.getElementById('bulkResetBtn').addEventListener('click', function(){
    if(!confirm('确定恢复默认数据吗？所有自定义修改将被清除。')) return;
    state.alliances = JSON.parse(JSON.stringify(DEFAULT_ALLIANCES));
    state.alliances = normalizeAlliances(state.alliances);
    state.consumes = {};
    saveAlliances(state.alliances);
    saveConsumes({});
    closeBulkModal();
    renderAll();
    toast('已恢复默认数据','success');
  });
  document.getElementById('addAllianceBtn').addEventListener('click', addAlliance);
  document.querySelectorAll('.bulk-tab').forEach(function(t){
    t.addEventListener('click', function(){ switchTab(this.dataset.tab); });
  });

  // 消耗编辑
  document.getElementById('consumeCloseBtn').addEventListener('click', closeConsumeModal);
  document.getElementById('consumeCancelBtn').addEventListener('click', closeConsumeModal);
  document.getElementById('consumeSaveBtn').addEventListener('click', saveConsume);

  // 恢复默认（主页）
  document.getElementById('resetBtn').addEventListener('click', function(){
    if(!confirm('确定恢复默认数据吗？所有自定义修改将被清除。')) return;
    state.alliances = JSON.parse(JSON.stringify(DEFAULT_ALLIANCES));
    state.alliances = normalizeAlliances(state.alliances);
    state.consumes = {};
    saveAlliances(state.alliances);
    saveConsumes({});
    renderAll();
    toast('已恢复默认数据','success');
  });

  // 对比基准
  document.getElementById('compareBaseSel').addEventListener('change', function(){
    state.compareBaseId = this.value;
    try{ localStorage.setItem(SK.compareBase, this.value); }catch(e){}
    renderCompare();
  });

  // 遮罩关闭
  document.getElementById('bulkModal').addEventListener('click', function(e){
    if(e.target===this) closeBulkModal();
  });
  document.getElementById('consumeModal').addEventListener('click', function(e){
    if(e.target===this) closeConsumeModal();
  });

  // 启动实时模式
  setRealtime(true);
  renderAll();
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{ init(); }
</script>
</body>
</html>
